<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce</title>
    <style>
        body {
            
            margin: 0;
            padding: 0;
            background-color: lightblue;

        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            color: white;
            padding: 1rem;
            width: 100%;
            height: 100px;
            box-sizing: border-box;

            
        }
        header h1 {
            margin: 0;
        }
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            text-align: right;
           
        }
        nav ul li {
            display: inline-block;
            margin-right: 1rem;
           
            
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            padding: 2rem;
        }
        .product-card {
            border: 6px solid #ccc;
            height: 400px;
            padding: 1rem;
            text-align: center;

        }
        .product-card:first-child img {
            width: 200px;
            height: 200px;
            object-fit: contain;
        }
        footer {
            background-color: lightyellow;
            text-align: center;
            padding: 1rem;
            margin-top: 150px;
            width: 100%;
            height: 100px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <header>
        <h1>Kl E-commerce</h1>
        <nav class="menu">
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Products</li>
                <li>Contact US</li>
            </ul>
        </nav>
    </header>
    <div class="products">
        <div class="product-card">
            <img src="iphone.jpg" alt="Product 1">
            <h2>IPhone 18 pro max</h2>
            <p>150000</p>
            
        </div>
        <div class="product-card">
            <img src="mac.jpg" alt="Product 2">
            <h2>MacBook Pro</h2>
            <p>200000</p>
        
        </div>
        <div class="product-card">
            <img src="s26.jpg" alt="Product 3">
            <h2>Samsung S26</h2>
            <p>150000</p>

        </div>
        
    </div>
    <footer>
        <p>thanks for visting our website!
            contact us for any more details
        </p>
        <h3>developed by kl university @2026</h3>
    </footer>
</body>
</html>
